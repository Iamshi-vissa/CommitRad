[project]
name = "commitrad"
version = "0.1.0"
description = "Predict risky commits and developer strain from git history."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydriller>=2.6",
    "pyarrow>=15",
]

[project.scripts]
commitrad = "commitrad.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
