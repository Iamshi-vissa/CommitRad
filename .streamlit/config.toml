# GitHub (Primer) look for the CommitRad dashboard. Streamlit reads this from the directory
# it is launched in, so run `commitrad dashboard` from the project root.

[theme]
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
headingFontWeights = 600
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true

[theme.light]
primaryColor = "#0969da"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"
textColor = "#1f2328"
linkColor = "#0969da"
borderColor = "#d1d9e0"
dataframeBorderColor = "#d1d9e0"
chartCategoricalColors = ["#0969da", "#bc4c00", "#1a7f37", "#8250df", "#cf222e"]

[theme.dark]
primaryColor = "#4493f8"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#151b23"
textColor = "#f0f6fc"
linkColor = "#4493f8"
borderColor = "#3d444d"
dataframeBorderColor = "#3d444d"
chartCategoricalColors = ["#4493f8", "#db6d28", "#3fb950", "#ab7df8", "#f85149"]
