# CommitRad dashboard theme: a dark, code-tool look. Streamlit reads this file from the
# directory it is launched in, so run `commitrad dashboard` from the project root.

[server]
# Serves src/commitrad/static/ (bundled fonts) at /app/static/, so the demo works offline.
enableStaticServing = true

[client]
# Demo mode: hide Streamlit's developer items (Deploy, rerun, settings).
toolbarMode = "viewer"

[theme]
base = "dark"
primaryColor = "#58a6ff"
backgroundColor = "#0a0c10"
secondaryBackgroundColor = "#11151b"
textColor = "#e6e9ee"
linkColor = "#58a6ff"
borderColor = "#222831"
dataframeBorderColor = "#222831"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
codeFont = "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
headingFontWeights = 600
chartCategoricalColors = ["#4493f8", "#db6d28", "#3fb950", "#ab7df8", "#f85149"]

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-700-normal.woff2"
weight = 700

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono-latin-700-normal.woff2"
weight = 700
